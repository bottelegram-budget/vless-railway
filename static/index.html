<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLESS Dashboard</title>
<style>
:root { --bg:#0b0e14; --card:#131722; --line:#232a3b; --line2:#2e3750; --txt:#e8ecf4; --dim:#8a93a8; --acc:#4f8cff; --ok:#2ecc71; --warn:#f1c40f; --err:#e74c3c; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; padding:24px; }
h1 { font-size:20px; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
h1 span { color:var(--dim); font-weight:400; font-size:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:22px; box-shadow:0 4px 20px rgba(0,0,0,.25); }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
.stat .label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
.stat .value { font-size:18px; margin-top:8px; word-break:break-all; }
table { width:100%; border-collapse:separate; border-spacing:0; }
thead th { color:var(--dim); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.6px; text-align:left; padding:10px 12px; border-bottom:2px solid var(--line2); }
tbody td { padding:12px; font-size:14px; border-bottom:1px solid var(--line); vertical-align:middle; }
tbody tr:hover td { background:rgba(79,140,255,.04); }
tbody tr:last-child td { border-bottom:none; }
button { background:var(--acc); color:#fff; border:none; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; transition:filter .15s; }
button:hover { filter:brightness(1.15); }
button.danger { background:transparent; color:var(--err); border:1px solid var(--err); }
button.ghost { background:transparent; color:var(--txt); border:1px solid var(--line2); }
input { background:#0d1017; border:1px solid var(--line2); border-radius:8px; color:var(--txt); padding:8px 12px; font-size:14px; outline:none; }
input:focus { border-color:var(--acc); }
.flex { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.badge { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; white-space:nowrap; }
.badge::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
.badge.on { background:rgba(46,204,113,.12); color:var(--ok); }
.badge.off { background:rgba(139,147,163,.12); color:var(--dim); }
.badge.warn { background:rgba(241,196,15,.12); color:var(--warn); }
.link { display:flex; gap:8px; align-items:center; max-width:100%; }
.link code { background:#0d1017; border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
#qrModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); align-items:center; justify-content:center; z-index:10; }
#qrModal.open { display:flex; }
#qrModal .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; text-align:center; max-width:90vw; box-shadow:0 8px 40px rgba(0,0,0,.5); }
#qrModal img { width:260px; height:260px; background:#fff; border-radius:8px; padding:8px; }
#qrModal .name { margin:12px 0 4px; font-weight:600; }
#qrModal code { display:block; font-size:11px; color:var(--dim); word-break:break-all; margin-top:8px; }
#qrStatus { color:var(--err); font-size:13px; min-height:18px; margin-top:8px; }
.login { max-width:360px; margin:15vh auto; }
.toast { position:fixed; bottom:20px; right:20px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; display:none; box-shadow:0 4px 20px rgba(0,0,0,.4); }
.muted { color:var(--dim); font-size:12px; }
#loginOverlay { display:none; }
body.noauth #loginOverlay { display:block; }
body.noauth #main { display:none; }
</style>
</head>
<body class="noauth">

<div id="loginOverlay">
  <div class="card login">
    <h1>VLESS Dashboard</h1>
    <p class="muted" style="margin-bottom:14px">Enter admin token to manage peers</p>
    <div class="flex">
      <input type="password" id="tokenInput" placeholder="ADMIN_TOKEN" style="flex:1">
      <button onclick="login()">Login</button>
    </div>
    <p class="muted" id="loginErr" style="margin-top:10px;color:var(--err)"></p>
  </div>
</div>

<div id="main">
  <h1>VLESS Dashboard <span id="domainLabel"></span></h1>

  <div class="grid">
    <div class="stat"><div class="label">Server</div><div class="value" id="srvDomain">-</div></div>
    <div class="stat"><div class="label">Port / TLS</div><div class="value" id="srvPort">-</div></div>
    <div class="stat"><div class="label">WS Path</div><div class="value" id="srvPath">-</div></div>
    <div class="stat"><div class="label">Peers</div><div class="value" id="srvPeers">-</div></div>
  </div>

  <div class="card">
    <div class="flex" style="justify-content:space-between;margin-bottom:16px">
      <h1 style="margin:0;font-size:16px">Peers <span id="activeCount"></span></h1>
      <div class="flex">
        <input type="text" id="newName" placeholder="peer name (optional)">
        <button onclick="addPeer()">+ New peer</button>
      </div>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Status</th><th>Traffic (down / up)</th><th>Share link</th><th style="width:180px">Actions</th></tr></thead>
      <tbody id="peerRows"></tbody>
    </table>
  </div>
</div>

<div id="qrModal"><div class="box">
  <div class="name" id="qrName"></div>
  <img id="qrImg" alt="QR">
  <div id="qrStatus"></div>
  <code id="qrLink"></code>
  <div class="flex" style="justify-content:center;margin-top:16px">
    <button onclick="copyQrLink()">Copy link</button>
    <button class="ghost" onclick="closeQr()">Close</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
let token = localStorage.getItem("vless_token") || "";
let peers = [];
let prevTraffic = {};
let lastActive = {};
const retryable = (e) => e && e.retryable;
const withRetry = async (fn, attempts = 6) => {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try { return await fn(); }
    catch (e) {
      lastErr = e;
      if (!retryable(e)) throw e;
      await new Promise(r => setTimeout(r, 250 * Math.pow(2, i)));
    }
  }
  throw lastErr;
};
const api = async (path, opts = {}) => withRetry(async () => {
  let r;
  try {
    r = await fetch(path, {
      ...opts,
      headers: { "Content-Type": "application/json", "X-Auth-Token": token, ...(opts.headers||{}) },
    });
  } catch (e) {
    e.retryable = true;
    throw e;
  }
  if (r.status === 401) { logout(); throw new Error("unauthorized"); }
  if (r.status === 404 || r.status >= 500) { const e = new Error("HTTP " + r.status); e.retryable = true; throw e; }
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
});
const toast = (msg) => { const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2500); };

function login() {
  token = document.getElementById("tokenInput").value.trim();
  if (!token) return;
  localStorage.setItem("vless_token", token);
  checkAuth();
}
function logout() {
  localStorage.removeItem("vless_token");
  token = "";
  document.body.classList.add("noauth");
}
async function checkAuth() {
  try {
    const r = await api("/api/auth");
    if (r.ok) { document.body.classList.remove("noauth"); loadAll(); }
    else document.getElementById("loginErr").textContent = "Invalid token";
  } catch (e) { /* already handled */ }
}

async function loadAll() {
  const info = await api("/api/info");
  document.getElementById("domainLabel").textContent = "— " + info.domain;
  document.getElementById("srvDomain").textContent = info.domain;
  document.getElementById("srvPort").textContent = info.port + " (TLS)";
  document.getElementById("srvPath").textContent = info.ws_path;
  await loadPeers();
}

function statusBadge(p, now) {
  const last = lastActive[p.id];
  if (last && now - last < 45000) return '<span class="badge on">ONLINE</span>';
  if (last) return '<span class="badge warn">IDLE · ' + ago(now - last) + '</span>';
  return '<span class="badge off">OFFLINE</span>';
}

async function loadPeers() {
  const list = await api("/api/peers");
  peers = list;
  const now = Date.now();
  for (const p of list) {
    const t = p.uplink + p.downlink;
    if (t > (prevTraffic[p.id] || 0)) lastActive[p.id] = now;
    prevTraffic[p.id] = t;
  }
  document.getElementById("srvPeers").textContent = peers.length;
  const online = peers.filter(p => lastActive[p.id] && now - lastActive[p.id] < 45000).length;
  document.getElementById("activeCount").textContent = "(" + online + " online)";
  const rows = peers.map(p => `
    <tr>
      <td>${escapeHtml(p.name)}</td>
      <td>${statusBadge(p, now)}</td>
      <td>${fmt(p.downlink)} / ${fmt(p.uplink)}</td>
      <td><div class="link"><code title="${escapeAttr(p.share)}">${escapeHtml(truncate(p.share, 60))}</code><button class="ghost" onclick="copyText('${escapeAttr(p.share)}')">Copy</button></div></td>
      <td>
        <button class="ghost" onclick="showQr('${p.id}','${escapeAttr(p.name)}','${escapeAttr(p.share)}')">QR</button>
        <button class="danger" onclick="delPeer('${p.id}')">Delete</button>
      </td>
    </tr>`).join("");
  document.getElementById("peerRows").innerHTML = rows;
}

async function addPeer() {
  const name = document.getElementById("newName").value.trim();
  const r = await api("/api/peers", { method: "POST", body: JSON.stringify({ name }) });
  document.getElementById("newName").value = "";
  toast("Peer created");
  await loadPeers();
}
async function delPeer(id) {
  if (!confirm("Delete this peer?")) return;
  await api("/api/peers/" + id, { method: "DELETE" });
  toast("Peer deleted");
  await loadPeers();
}

async function showQr(id, name, link) {
  document.getElementById("qrName").textContent = name;
  document.getElementById("qrLink").textContent = link;
  document.getElementById("qrModal").classList.add("open");
  window._qrLink = link;
  const img = document.getElementById("qrImg");
  const status = document.getElementById("qrStatus");
  img.style.display = "none";
  status.textContent = "Loading QR…";
  status.style.color = "var(--dim)";
  try {
    const r = await withRetry(async () => {
      const res = await fetch("/api/qr/" + id, { headers: { "X-Auth-Token": token } });
      if (!res.ok) { const e = new Error("HTTP " + res.status); e.retryable = true; throw e; }
      return res;
    });
    img.src = URL.createObjectURL(await r.blob());
    img.style.display = "block";
    status.textContent = "";
  } catch (e) {
    status.textContent = "QR failed to load";
    status.style.color = "var(--err)";
  }
}
function closeQr() { document.getElementById("qrModal").classList.remove("open"); }
function copyQrLink() { copyText(window._qrLink); }
function copyText(t) {
  navigator.clipboard.writeText(t).then(() => toast("Copied")).catch(() => toast("Copy failed"));
}
function fmt(bytes) {
  if (bytes >= 1e9) return (bytes/1e9).toFixed(2) + " GB";
  if (bytes >= 1e6) return (bytes/1e6).toFixed(1) + " MB";
  if (bytes >= 1e3) return (bytes/1e3).toFixed(1) + " KB";
  return bytes + " B";
}
function ago(ms) {
  const s = Math.round(ms / 1000);
  if (s < 60) return s + "s ago";
  const m = Math.round(s / 60);
  if (m < 60) return m + "m ago";
  return Math.round(m / 60) + "h ago";
}
function truncate(s, n) { return s.length > n ? s.slice(0, n) + "…" : s; }
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function escapeAttr(s) { return escapeHtml(s); }

checkAuth();
setInterval(() => { if (!document.body.classList.contains("noauth")) loadPeers().catch(() => {}); }, 8000);
</script>
</body>
</html>
